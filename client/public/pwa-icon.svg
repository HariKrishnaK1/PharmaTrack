<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="ptGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdfa" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="#0f172a" />
  <circle cx="256" cy="256" r="190" fill="url(#ptGrad)" opacity="0.15" />
  <g transform="translate(256,256) rotate(-45) translate(-140,-70)">
    <!-- Pill body left half -->
    <path d="M 70,0 A 70,70 0 0,0 70,140 L 140,140 L 140,0 Z" fill="#0d9488" />
    <!-- Pill body right half -->
    <path d="M 140,0 L 210,0 A 70,70 0 0,1 210,140 L 140,140 Z" fill="url(#pillGrad)" />
    <!-- Center divider -->
    <line x1="140" y1="0" x2="140" y2="140" stroke="#0f172a" stroke-width="6" opacity="0.4" />
    <!-- Pill shine -->
    <path d="M 40,35 A 40,40 0 0,1 100,20" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.6" />
  </g>
</svg>
